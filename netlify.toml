[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Sourcing nocturno automático: 9-14 UTC = 3-8am CDMX (UTC-6 fijo), DIARIO.
# 6 corridas escalonadas × 2 vacantes × ~25 netos + rotación de términos por
# hora = meta 150+/día (pedido 2026-09-26). Serper como fuente primaria
# (~130 créditos/día); si el saldo se agota cae a motores gratis + campanita.
[functions."cron-auto-source"]
  schedule = "0 9,10,11,12,13,14 * * *"

# Digest matutino: 13 UTC = 7am CDMX, L-V (después de las corridas nocturnas).
[functions."cron-daily-digest"]
  schedule = "0 13 * * 1-5"

# Higiene de base (Fase 4): re-verificación de perfiles (Serper + scraper).
# 6 corridas diarias SIN empalmar con el sourcing (9-14): 5-8 UTC = 11pm-2am
# CDMX y 15-16 UTC = 9-10am. Con Serper el sourcing mete 150+/día y una sola
# corrida de ~15 dejaba crecer la cuarentena más rápido de lo que drenaba.
[functions."cron-verify-profiles"]
  schedule = "0 5,6,7,8,15,16 * * *"

# Motor de secuencias (Fase 5): cada 20 min de 14-23 UTC = 8am-5pm CDMX, L-V.
# SOLO horario laboral — anti-ban: jamás enviar de madrugada ni en fin de semana.
[functions."cron-sequence-runner"]
  schedule = "*/20 14-23 * * 1-5"

# Sync de actividad LinkedIn (Fase 5): persiste invitaciones aceptadas y
# respuestas de Unipile → pausa secuencias al detectar respuesta. Solo lectura.
[functions."cron-activity-sync"]
  schedule = "*/30 13-23 * * *"

# Vigilante de SLAs (Fase 6): 13:30 UTC = 7:30am CDMX, L-V — media hora
# después del digest para no empalmar envíos de Resend.
[functions."cron-sla-check"]
  schedule = "30 13 * * 1-5"

# Recordatorios de entrevista (Fase 7): cada hora de 14-23 UTC = 8am-5pm CDMX.
# Ventana 20-28h al futuro ("mañana"); reminder_sent evita duplicados y solo
# se marca cuando el email salió de verdad (sin RESEND_API_KEY reintenta).
[functions."cron-interview-reminders"]
  schedule = "0 14-23 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
